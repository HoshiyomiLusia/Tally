services:
  app:
    build:
      context: .
      args:
        # 子路径部署: 在本机 .env 里设 VITE_BASE=/tally/ 之类 (带首尾斜杠); 默认 / 为根部署
        VITE_BASE: "${VITE_BASE:-/}"
    container_name: tally
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8002"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/tally.db
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # 审计 #111/#117: 容器时区, 默认 Asia/Shanghai(部署地可用 .env 改); 影响 date.today() 相关逻辑
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
      # 跟随宿主时区文件(存在即用), 与 TZ 环境变量双保险
      - /etc/localtime:/etc/localtime:ro
